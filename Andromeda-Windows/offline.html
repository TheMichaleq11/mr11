<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Andromeda — brak połączenia</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    color: #fff; display: grid; place-items: center; -webkit-app-region: drag;
    background:
      radial-gradient(70% 60% at 78% 18%, rgba(120, 220, 255, 0.35), transparent 60%),
      radial-gradient(90% 80% at 20% 100%, rgba(0, 32, 184, 0.7), transparent 70%),
      rgba(0, 64, 255, 0.55);
  }
  body.ostre { background: transparent; padding: 14px; box-sizing: border-box; }
  body.ostre .tafla { border-radius: 26px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); background: radial-gradient(70% 60% at 78% 18%, rgba(120, 220, 255, 0.55), transparent 60%), radial-gradient(90% 80% at 20% 100%, #0020B8, transparent 70%), #0040FF; }
  .tafla { width: 100%; height: 100%; display: grid; place-items: center; position: relative; }
  .btns { position: absolute; top: 10px; right: 12px; display: flex; gap: 2px; -webkit-app-region: no-drag; }
  .btns button { width: 34px; height: 30px; border-radius: 9px; padding: 0; background: transparent; box-shadow: none; display: grid; place-items: center; }
  .btns button:hover { background: rgba(255,255,255,0.14); }
  .btns .x:hover { background: #E5484D; }
  body.pelne { background: radial-gradient(70% 60% at 78% 18%, rgba(120, 220, 255, 0.55), transparent 60%), radial-gradient(90% 80% at 20% 100%, #0020B8, transparent 70%), #0040FF; }
  .box { text-align: center; max-width: 360px; padding: 24px; }
  img { width: 96px; height: 96px; display: block; margin: 0 auto 18px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 26px; line-height: 1.5; color: rgba(255, 255, 255, 0.82); font-size: 14.5px; }
  button {
    -webkit-app-region: no-drag; font: inherit; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer;
    height: 46px; padding: 0 26px; border: none; border-radius: 12px;
    background: rgba(255, 255, 255, 0.16); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
  }
  button:hover { background: rgba(255, 255, 255, 0.26); }
  small { display: block; margin-top: 14px; color: rgba(255, 255, 255, 0.6); font-size: 12.5px; }
</style>
</head>
<body>
 <div class="tafla">
  <div class="btns">
    <button type="button" id="min" aria-label="Zminimalizuj"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.5h8" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <button type="button" id="zamknij" class="x" aria-label="Zamknij"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>
  <div class="box">
    <img src="build/icon.png" alt="">
    <h1>Brak połączenia</h1>
    <p>Andromeda pobiera plan i oceny prosto z USOS, więc potrzebuje internetu. Sprawdź Wi-Fi i spróbuj jeszcze raz.</p>
    <button id="ponow" type="button">Spróbuj ponownie</button>
    <small id="auto">Sprawdzam co kilka sekund…</small>
  </div>
 </div>
<script>
  const q = new URLSearchParams(location.search);
  const url = q.get('u') || '';
  const tryb = q.get('tryb');
  if (tryb === 'ostre') document.body.classList.add('ostre');
  else if (tryb !== 'szklo') document.body.classList.add('pelne');
  document.getElementById('min').addEventListener('click', () => window.andromedaOkno && window.andromedaOkno.min());
  document.getElementById('zamknij').addEventListener('click', () => window.andromedaOkno && window.andromedaOkno.zamknij());
  const ponow = () => window.andromedaOkno && window.andromedaOkno.ponow(url);
  document.getElementById('ponow').addEventListener('click', ponow);
  // wraca samo, gdy tylko pojawi się internet
  window.addEventListener('online', ponow);
  setInterval(() => { if (navigator.onLine) ponow(); }, 8000);
</script>
</body>
</html>
